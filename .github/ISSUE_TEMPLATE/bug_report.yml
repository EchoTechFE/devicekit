name: Bug report
description: Report a problem with a devicekit package
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@devicekit/devices"
        - "@devicekit/frame"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version you're using (see your package.json / lockfile).
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, self-contained way to trigger the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/runtime, Node.js version, and any other relevant context.
    validations:
      required: false
